[project]
name = "aqua-self-pruning"
version = "0.1.0"
description = "Reverse-mode autodiff and a self-pruning MLP in pure NumPy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
